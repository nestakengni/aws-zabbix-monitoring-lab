---
- name: Deploy Zabbix stack with Docker Compose
  hosts: zabbix
  become: true
  gather_facts: false

  tasks:
    - name: Create Zabbix deployment directory
      ansible.builtin.file:
        path: /opt/zabbix
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/compose.yaml"
        dest: /opt/zabbix/compose.yaml
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create environment file from Ansible Vault
      ansible.builtin.copy:
        dest: /opt/zabbix/.env
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          MYSQL_DATABASE={{ zabbix_mysql_database }}
          MYSQL_USER={{ zabbix_mysql_user }}
          MYSQL_PASSWORD={{ zabbix_mysql_password }}
          MYSQL_ROOT_PASSWORD={{ zabbix_mysql_root_password }}
      no_log: true

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose config -q
        chdir: /opt/zabbix
      changed_when: false

    - name: Pull Docker images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: /opt/zabbix
      changed_when: true

    - name: Start Zabbix containers
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/zabbix
      changed_when: true

    - name: Wait for Zabbix Web
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        timeout: 120

    - name: Check running containers
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: /opt/zabbix
      register: docker_ps
      changed_when: false

    - name: Display running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines
