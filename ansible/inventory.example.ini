[zabbix]
zabbix-server ansible_host=ZABBIX_PUBLIC_IP

[linux]
linux-server ansible_host=LINUX_PUBLIC_IP

[windows]
windows-server ansible_host=WINDOWS_PUBLIC_IP

[linux_hosts:children]
zabbix
linux

[linux_hosts:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/zabbix-lab-key
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

[windows:vars]
ansible_user=Administrator
ansible_connection=winrm
ansible_port=5986
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
